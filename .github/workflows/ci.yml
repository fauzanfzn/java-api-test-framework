name: API tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *" # daily 09:00 WIB, catches API drift even without code changes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests (mock + live)
        run: mvn -B test -Dmaven.test.failure.ignore=true

      - name: Readiness summary
        if: always()
        run: python3 scripts/summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Build Allure report
        if: always()
        run: |
          mvn -B -q allure:report
          cp target/site/allure-maven-plugin/allure-maven.html target/site/allure-maven-plugin/index.html

      - uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: target/site/allure-maven-plugin

      - name: Quality gate
        run: python3 scripts/summary.py --gate

  deploy:
    needs: test
    if: always() && github.ref == 'refs/heads/main' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
